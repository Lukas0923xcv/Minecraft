# ScalableLux: parallel lighting engine (fork of Starlight)
# https://modrinth.com/mod/scalablelux
#
# THIS VALUE IS IGNORED IN THIS PACK.
# With C2ME installed, C2ME runs ScalableLux's light tasks on its own global
# executor, and the log shows "Lighting scaling is enabled in externally managed
# mode". The lighting thread count is then config/c2me.toml ->
# globalExecutorParallelism.
#
# Used only if you remove C2ME: -1 = auto (cpus / 3); N = N lighting threads.
# Parallel lighting is enabled only when this resolves to >= 2.
parallelism=-1
