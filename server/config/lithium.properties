# Lithium: general tick and game-logic optimizations (single-threaded, safe).
# https://github.com/CaffeineMC/lithium/wiki/Configuration-File
#
# Everything is at Lithium's defaults except the option below.
#
# mixin.alloc.chunk_random=false
#   Required by Async: Lithium's chunk_random replaces the per-world random
#   used for random ticks with a shared, non-thread-safe instance. Async ticks
#   worlds from several threads, so it declares this override in its own
#   fabric.mod.json and Lithium already turns it off automatically ("1
#   override(s) found" in the log). It is written here as well so it stays off
#   if Async is ever removed and re-added, or its metadata changes.
#
# No other Lithium option has to be disabled for Async, C2ME or ScalableLux in
# these versions: Async ships its own locking mixins for Lithium's entity
# movement trackers, block-change trackers and item-entity lists.
mixin.alloc.chunk_random=false
