#Configuration file for VMP
# Very Many Players: networking and player/entity tracking for high player counts.
# All values are VMP defaults. VMP re-saves this file and drops these comments.
# use_multiple_netty_event_loops: spreads player connections over several Netty
#   IO threads (sized by Netty to the cpu count; separate from the pools above).
# use_async_chunks_on_login_v2: loads the spawn chunk of joining players off
#   the main thread.
optimized_entity_tracking_use_staging_area=true
show_async_loading_messages=true
show_chunk_tracking_messages=true
target_chunk_send_rate=-1
use_async_chunks_on_login_v2=true
use_async_chunks_on_some_commands=false
use_async_logging=true
use_async_portals=true
use_multiple_netty_event_loops=true
use_optimized_entity_tracking=true
