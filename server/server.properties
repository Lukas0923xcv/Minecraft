# Tuned for a 4-8 core host running Async + C2ME + ScalableLux.
# Minecraft rewrites this file on first start and drops these comments; the
# reasoning is kept in README.md ("server.properties").
#
# simulation-distance=6: entity/block/redstone ticking is the most expensive
#   per-chunk work and (apart from entities via Async) stays on the main thread.
#   6 = 13x13 ticking chunks per player instead of 21x21 at 10 (~2.6x fewer).
# view-distance=10: chunks outside the simulation distance are only loaded,
#   lit and sent. That is C2ME/ScalableLux work on the worker threads, so a
#   larger view distance costs little main-thread time.
# sync-chunk-writes=true: vanilla default, kept for crash/power-loss safety.
# white-list=true: vanilla default since 26.1; add yourself with /whitelist add.
# management-server-secret is deliberately absent: the server generates one.
accepts-transfers=false
allow-flight=false
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
bug-report-link=
chat-spam-threshold-seconds=10
command-spam-threshold-seconds=10
difficulty=normal
enable-code-of-conduct=false
enable-jmx-monitoring=false
enable-query=false
enable-rcon=false
enable-status=true
enforce-secure-profile=true
enforce-whitelist=false
entity-broadcast-range-percentage=100
force-gamemode=false
function-permission-level=2
gamemode=survival
generate-structures=true
generator-settings={}
hardcore=false
hide-online-players=false
initial-disabled-packs=
initial-enabled-packs=vanilla,fabric-convention-tags-v2
level-name=world
level-seed=
level-type=minecraft\:normal
log-ips=true
management-server-allowed-origins=
management-server-enabled=false
management-server-host=localhost
management-server-port=0
management-server-tls-enabled=true
management-server-tls-keystore=
management-server-tls-keystore-password=
max-chained-neighbor-updates=1000000
max-players=20
max-tick-time=60000
max-world-size=29999984
motd=Fabric multi-core server
network-compression-threshold=256
online-mode=true
op-permission-level=4
pause-when-empty-seconds=60
player-idle-timeout=0
prevent-proxy-connections=false
query.port=25565
rate-limit=0
rcon.password=
rcon.port=25575
region-file-compression=deflate
require-resource-pack=false
resource-pack=
resource-pack-id=
resource-pack-prompt=
resource-pack-sha1=
server-ip=
server-port=25565
simulation-distance=6
spawn-protection=16
status-heartbeat-interval=0
sync-chunk-writes=true
text-filtering-config=
text-filtering-version=0
use-native-transport=true
view-distance=10
white-list=true
