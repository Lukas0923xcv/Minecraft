# modpack.toml: the single source of truth for this server pack.
#
# scripts/build.py turns this file into dist/ (downloads every file, verifies its
# hash, fails on mismatch). scripts/update.py rewrites the pinned versions and
# hashes below; prefer running it over editing pins by hand.
#
# Per-mod fields:
#   slug / project_id   Modrinth project
#   channel             least stable Modrinth build type update.py may pick
#                       (release | beta | alpha). The threading mods only publish
#                       alpha builds, so they are pinned to "alpha" on purpose.
#   version_id / version_number / filename / url / sha512   the pinned build
#   workload            what the mod does in this pack (used in release notes)

[minecraft]
version = "26.3"
java = 25
server_sha1 = "33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c"

[fabric]
loader = "0.20.1"
installer = "1.1.2"
launcher_sha256 = "70446947655b4f8f286aba896aa4c19a255e8ca8a730636ef2a6017ae4415d95"

[tuning]
# One knob for the worker pools of Async (entities) and C2ME (chunks + lighting).
#   0  = auto: C2ME uses max(1, cpus - 1), Async uses its own auto (~cpus / 1.3)
#   N  = pin both pools to N threads (recommended: physical cores - 1)
# build.py writes this into config/async.toml and config/c2me.toml.
worker_threads = 0

[dashboard]
# perfdash: the in-game load dashboard built from dashboard/ by build_dashboard.py.
# compile = jars it is compiled against (not shipped); sha256 pinned after a Maven .sha1 check.
version = "1.0.0"

[[dashboard.compile]]
coord = "net.fabricmc:fabric-loader:0.20.1"
repo = "https://maven.fabricmc.net/"
sha256 = "d0c5a082e07410aaff9de7ab196aa6b4236002870f9ba3ad5c1260fcce5110ad"

[[dashboard.compile]]
coord = "net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7"
repo = "https://maven.fabricmc.net/"
sha256 = "03f0065023bfc3045d71bfb99872451d9ad5a0800a5a0dac34ab8c7d5c134f5d"

